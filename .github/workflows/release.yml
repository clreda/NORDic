name: Release

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - run: sed -i "s:9999:${VERSION//*v/}:" setup.py conda/meta.yaml
      env:
          VERSION: ${{ github.ref }}
    - uses: actions/setup-python@v1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    - name: Build and publish
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        python setup.py sdist bdist_wheel
        twine upload dist/*
  conda-publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - run: sed -i "s:9999:${VERSION//*v/}:" setup.py conda/meta.yaml
      env:
          VERSION: ${{ github.ref }}
    - uses: conda-incubator/setup-miniconda@v3.1.0
      with:
          miniconda-version: "latest"
    - name: prepare
      run: |
        python setup.py sdist bdist_wheel
        conda install anaconda-client conda-build conda-verify yaml conda-libmamba-solver -y
        conda install -c conda-forge python-libarchive-c -y
        conda config --set solver libmamba
        conda config --set channel_priority flexible
        conda config --set anaconda_upload no
        conda remove --name base conda-anaconda-telemetry -y
    - name: build
      run: |
        cd conda
        CONDA_BASE=$(conda info --base)
	CONDA_PYTHON="$CONDA_BASE/bin/python"
	$CONDA_PYTHON -m pip install pyyaml libarchive beautifulsoup4 evalidate py-rattler-build --force-reinstall
        NORDIC_CONDA=$(conda info --base)/bin/conda
        PACKAGE=$($NORDIC_CONDA build --user creda --token $ANACONDA_TOKEN --override-channels -c conda-forge -c colomoto -c bioconda . --output | grep linux-64 | head -1)
	ANACONDA_DIR=$(dirname $(which anaconda))
	PYTHON_PATH="$ANACONDA_DIR/../bin/python"
	$PYTHON_PATH -m pip install python-dateutil defusedxml nbformat
        anaconda --token $ANACONDA_TOKEN upload $PACKAGE
      env:
        ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
